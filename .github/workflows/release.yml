name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:

  # ── Windows EXE ──────────────────────────────────────────────────────────
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          pip install pyinstaller PyQt6
          pip install -e .

      - name: EXEs bauen
        run: |
          pyinstaller --onefile --name storage-box-sync packaging/build_exe_main.py
          pyinstaller --onefile --windowed --exclude-module dbus --name storage-box-sync-fenster packaging/build_exe_fenster.py
          pyinstaller --onefile --windowed --exclude-module dbus --name storage-box-sync-symbol packaging/build_exe_symbol.py

      - name: ZIP erstellen
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/storage-box-sync.exe,dist/storage-box-sync-fenster.exe,dist/storage-box-sync-symbol.exe `
            -DestinationPath "storage-box-sync-${{ github.ref_name }}-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: storage-box-sync-*-windows.zip

  # ── Debian .deb ──────────────────────────────────────────────────────────
  debian-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .deb bauen
        run: |
          set -e
          python3 -m venv venv
          venv/bin/pip install --quiet .
          VERSION=$(venv/bin/python3 -c "from storage_box_sync import __version__; print(__version__)")
          PYVER=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          PKG=deb_pkg
          mkdir -p "${PKG}/usr/bin" "${PKG}/usr/lib/python3/dist-packages" "${PKG}/DEBIAN"
          cp -r "venv/lib/python${PYVER}/site-packages/storage_box_sync" "${PKG}/usr/lib/python3/dist-packages/"
          find "venv/lib/python${PYVER}/site-packages/" -maxdepth 1 -name 'storage_box_sync*.dist-info' \
            -exec cp -r {} "${PKG}/usr/lib/python3/dist-packages/" \;
          for script in storage-box-sync storage-box-sync-fenster storage-box-sync-symbol; do
            sed 's|^#!.*|#!/usr/bin/python3|' "venv/bin/${script}" > "${PKG}/usr/bin/${script}"
            chmod 755 "${PKG}/usr/bin/${script}"
          done
          {
            echo "Package: storage-box-sync"
            echo "Version: ${VERSION}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: all"
            echo "Maintainer: Stephan Roesner <stephan.roesner@protonmail.com>"
            echo "Depends: python3 (>= 3.9), python3-dbus, python3-gi, gir1.2-glib-2.0"
            echo "Recommends: python3-pyqt6, rclone"
            echo "Description: Zweiweg-Abgleich zwischen einem Ordner und einer Hetzner Storage Box"
            echo " Haelt einen Ordner auf dem Rechner und eine Hetzner Storage Box"
            echo " in beide Richtungen abgeglichen."
          } > "${PKG}/DEBIAN/control"
          dpkg-deb --build --root-owner-group "${PKG}" "storage-box-sync_${VERSION}_all.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: debian-deb
          path: storage-box-sync_*.deb

  # ── Hochladen an die GitHub-Release ──────────────────────────────────────
  release-upload:
    needs: [windows-exe, debian-deb]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: debian-deb
          path: artifacts/

      - name: Dateien hochladen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --clobber
